-
  name: Install Docker
  hosts: junnon_servers
  become: yes

  tasks:
    - name: Install Docker when OS is RedHat/CentOS
      dnf:
        name: docker-ce
        state: latest

      when: ansible_distribution == 'CentOS' or ansible_distribution == 'RedHat' or ansible_distribution == 'Amazon'

    - name: Install docker when OS is Ubuntu
      package:
        name: docker.io
        state: latest
      when: ansible_distribution == 'Ubuntu'
    
    - name: Start Docker
      systemd_service:
        name: docker
        state: started
      when: ansible_distribution == 'Amazon' or ansible_distribution == 'CentOS' or ansible_distribution == 'Ubuntu' 


    - name: Start docker for ResdHat
      systemd_service:
        name: docker
        state: started
      when:  ansible_distribution == 'RedHat'  
